<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abraham's Drone Coding School</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --sky: #0a0e2e;
    --sky2: #111840;
    --panel: #161d45;
    --panel2: #1e2657;
    --accent: #00d4ff;
    --accent2: #7c3aed;
    --green: #22c55e;
    --amber: #f59e0b;
    --text: #e8eaf6;
    --muted: #8892b0;
    --border: rgba(0,212,255,0.15);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Nunito', sans-serif; background: var(--sky); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  .stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; background: radial-gradient(1px 1px at 10% 15%, rgba(255,255,255,0.6) 0%, transparent 100%), radial-gradient(1px 1px at 25% 40%, rgba(255,255,255,0.4) 0%, transparent 100%), radial-gradient(1.5px 1.5px at 40% 8%, rgba(255,255,255,0.5) 0%, transparent 100%), radial-gradient(1px 1px at 60% 25%, rgba(255,255,255,0.3) 0%, transparent 100%), radial-gradient(1px 1px at 75% 12%, rgba(255,255,255,0.5) 0%, transparent 100%), radial-gradient(1px 1px at 88% 88%, rgba(255,255,255,0.4) 0%, transparent 100%); }
  header { position: relative; z-index: 10; display: flex; align-items: center; gap: 14px; padding: 14px 20px; background: var(--panel); border-bottom: 1px solid var(--border); }
  .drone-icon { font-size: 28px; animation: hoverfloat 3s ease-in-out infinite; }
  @keyframes hoverfloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  .header-title h1 { font-size: 18px; font-weight: 900; color: var(--accent); font-family: 'Space Mono', monospace; }
  .header-title p { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .level-badge { background: var(--panel2); border: 1px solid var(--border); border-radius: 20px; padding: 5px 12px; font-size: 12px; color: var(--accent); font-family: 'Space Mono', monospace; margin-left: auto; }
  .chat-wrap { flex: 1; overflow-y: auto; padding: 20px; position: relative; z-index: 5; scroll-behavior: smooth; }
  .chat-wrap::-webkit-scrollbar { width: 4px; }
  .chat-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .msg { display: flex; gap: 10px; margin-bottom: 16px; animation: fadeUp 0.3s ease; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .msg.user { flex-direction: row-reverse; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; margin-top: 2px; }
  .avatar.ai { background: linear-gradient(135deg, var(--accent2), var(--accent)); }
  .avatar.user-av { background: var(--panel2); border: 1px solid var(--border); font-size: 13px; font-weight: 700; color: var(--accent); }
  .bubble { max-width: 75%; padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.65; }
  .bubble.ai { background: var(--panel2); border: 1px solid var(--border); border-top-left-radius: 4px; }
  .bubble.user { background: var(--accent2); border-top-right-radius: 4px; color: #fff; }
  .bubble code { font-family: 'Space Mono', monospace; background: rgba(0,0,0,0.3); padding: 1px 5px; border-radius: 4px; font-size: 12px; color: var(--accent); }
  .bubble pre { background: #0d1117; border: 1px solid rgba(0,212,255,0.2); border-radius: 8px; padding: 12px; margin: 8px 0; overflow-x: auto; font-family: 'Space Mono', monospace; font-size: 12px; line-height: 1.6; color: #a8ff78; }
  .typing { display: flex; gap: 5px; align-items: center; padding: 4px 0; }
  .typing span { width: 6px; height: 6px; background: var(--accent); border-radius: 50%; animation: blink 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%,80%,100% { opacity: 0.2; transform: scale(0.8); } 40% { opacity: 1; transform: scale(1); } }
  .quick-prompts { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 20px 12px; position: relative; z-index: 5; }
  .qp { background: var(--panel); border: 1px solid var(--border); border-radius: 20px; padding: 6px 14px; font-size: 12px; color: var(--muted); cursor: pointer; transition: all 0.2s; font-family: 'Nunito', sans-serif; }
  .qp:hover { background: var(--panel2); color: var(--accent); border-color: var(--accent); }
  .input-area { position: relative; z-index: 10; padding: 12px 20px 16px; background: var(--panel); border-top: 1px solid var(--border); display: flex; gap: 10px; align-items: flex-end; }
  textarea { flex: 1; background: var(--panel2); border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; color: var(--text); font-family: 'Nunito', sans-serif; font-size: 14px; resize: none; outline: none; max-height: 120px; min-height: 44px; line-height: 1.5; transition: border-color 0.2s; }
  textarea:focus { border-color: var(--accent); }
  textarea::placeholder { color: var(--muted); }
  .send-btn { width: 44px; height: 44px; background: linear-gradient(135deg, var(--accent2), var(--accent)); border: none; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; transition: transform 0.15s, opacity 0.15s; flex-shrink: 0; }
  .send-btn:hover { transform: scale(1.05); }
  .send-btn:active { transform: scale(0.97); }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .bday-banner { display: none; background: linear-gradient(135deg, #7c3aed, #f59e0b); text-align: center; padding: 10px; font-size: 14px; font-weight: 700; color: #fff; position: relative; z-index: 10; }
</style>
</head>
<body>
<div class="stars"></div>
<div class="bday-banner" id="bdayBanner">🎂 Happy 11th Birthday, Abraham! Today you are officially a drone engineer! 🚁🎉</div>
<header>
  <div class="drone-icon">🚁</div>
  <div class="header-title">
    <h1>ABRAHAM'S DRONE SCHOOL</h1>
    <p>Python · Raspberry Pi · Robotics · Drones</p>
  </div>
  <div class="level-badge">LVL 1 — CADET</div>
</header>
<div class="chat-wrap" id="chatWrap"></div>
<div class="quick-prompts" id="quickPrompts">
  <button class="qp" onclick="sendQuick('Teach me my first Python lesson')">🐍 Start Python lesson</button>
  <button class="qp" onclick="sendQuick('What cool things can I build with a Raspberry Pi?')">🥧 Raspberry Pi ideas</button>
  <button class="qp" onclick="sendQuick('How does a drone fly and how do I program one?')">🚁 Drone programming</button>
  <button class="qp" onclick="sendQuick('Can you help me build a simple robot?')">🤖 Build a robot</button>
  <button class="qp" onclick="sendQuick('I want to make a simple game in Python')">🎮 Make a game</button>
</div>
<div class="input-area">
  <textarea id="userInput" placeholder="Ask me anything about Python, drones, or Raspberry Pi..." rows="1"></textarea>
  <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="Send">🚀</button>
</div>
<script>
const WORKER_URL = 'https://abrahams-drone-school.jazzpropertiesmn.workers.dev';
const SYSTEM_PROMPT = 'You are a creative coding collaborator for Abraham, who is 11 years old. Your job is NOT to teach him syntax or make him memorize code — it is to help him develop ideas and bring them to life using AI as his tool.

Your approach:
- Start by asking what he wants to BUILD or what problem he wants to SOLVE, not what he wants to learn
- When he has an idea, get excited about it and help him develop it further with questions like "what should it do?", "what would make it cooler?", "what happens when...?"
- Write the code FOR him, then explain what it does in simple terms so he understands the concept
- Teach him how to describe ideas clearly to AI — this is the most important skill
- Encourage him to tweak, break, and experiment — "what if we changed this part?"
- When he gets stuck, ask "what do you want it to do differently?" not "do you know what a variable is?"
- Celebrate every idea, no matter how wild — "a drone that follows my dog" is a perfect project
- Topics: Python, Raspberry Pi, drones, robotics, games, animations, anything he wants to build
- If he asks about something unrelated to building/coding/robotics, kindly redirect him
- Never give homework-style exercises unless he asks — always lead with building something fun
- His superpower is his imagination. Your job is to make it real.
Then commit to main. That's the only change needed!';
let history = [];
let isTyping = false;
function isBirthday() { const now = new Date(); return now.getMonth() === 5 && now.getDate() === 19; }
function formatText(text) {
  text = text.replace(/```[\w]*\n?([\s\S]*?)```/g, function(_, code) { const safe = code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); return '<pre>' + safe + '</pre>'; });
  text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
  text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
  text = text.replace(/\n/g, '<br>');
  return text;
}
function renderMessage(role, text) {
  const wrap = document.getElementById('chatWrap');
  const div = document.createElement('div');
  div.className = 'msg' + (role === 'user' ? ' user' : '');
  const avatar = document.createElement('div');
  avatar.className = 'avatar ' + (role === 'user' ? 'user-av' : 'ai');
  avatar.textContent = role === 'user' ? 'A' : '🤖';
  const bubble = document.createElement('div');
  bubble.className = 'bubble ' + (role === 'user' ? 'user' : 'ai');
  bubble.innerHTML = formatText(text);
  div.appendChild(avatar); div.appendChild(bubble);
  wrap.appendChild(div);
  wrap.scrollTop = wrap.scrollHeight;
}
function showTyping() {
  const wrap = document.getElementById('chatWrap');
  const div = document.createElement('div');
  div.className = 'msg'; div.id = 'typingIndicator';
  const avatar = document.createElement('div');
  avatar.className = 'avatar ai'; avatar.textContent = '🤖';
  const bubble = document.createElement('div');
  bubble.className = 'bubble ai';
  bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  div.appendChild(avatar); div.appendChild(bubble);
  wrap.appendChild(div); wrap.scrollTop = wrap.scrollHeight;
}
function removeTyping() { const el = document.getElementById('typingIndicator'); if (el) el.remove(); }
async function sendMessage() {
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text || isTyping) return;
  input.value = ''; input.style.height = 'auto';
  document.getElementById('quickPrompts').style.display = 'none';
  history.push({ role: 'user', content: text });
  renderMessage('user', text);
  isTyping = true;
  document.getElementById('sendBtn').disabled = true;
  showTyping();
  try {
    const response = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: 'claude-sonnet-4-5', max_tokens: 1000, system: SYSTEM_PROMPT, messages: history.slice(-10) })
    });
    const data = await response.json();
    const reply = data.content && data.content[0] ? data.content[0].text : 'Hmm, something went wrong. Try again!';
    removeTyping();
    history.push({ role: 'assistant', content: reply });
    renderMessage('assistant', reply);
  } catch (e) {
    removeTyping();
    renderMessage('assistant', 'Oops! Error: ' + e.message);
  }
  isTyping = false;
  document.getElementById('sendBtn').disabled = false;
}
function sendQuick(text) { document.getElementById('userInput').value = text; sendMessage(); }
document.getElementById('userInput').addEventListener('input', function() { this.style.height = 'auto'; this.style.height = Math.min(this.scrollHeight, 120) + 'px'; });
document.getElementById('userInput').addEventListener('keydown', function(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
if (isBirthday()) document.getElementById('bdayBanner').style.display = 'block';
window.addEventListener('load', function() {
  const welcome = isBirthday() ? 'Happy Birthday Abraham! You are 11 today! 🎂🚁 Ready to become a drone engineer? Pick a button or ask me anything!' : 'Hey Abraham! 👋 Welcome to YOUR Coding School! 🚁🤖\n\nI am your personal teacher for Python, Raspberry Pi, robotics, and drones. Pick a button below or just type your first question!';
  renderMessage('assistant', welcome);
  history.push({ role: 'assistant', content: welcome });
});
</script>
</body>
</html>
